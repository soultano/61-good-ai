<title>61 GOOD AI</title>

<style>
:root{--ink:#16132B;--paper:#F6F4FF;--card:#fff;--soft:#E9E5F8;--muted:#6B6690;--lime:#C8FF3D;--violet:#7C5CFF;--pink:#FF5FA2;--sky:#41D3FF;--sun:#FFC83D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.u{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{position:relative;width:100%;height:100%;border-radius:42px;background:var(--paper);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;padding:22px 18px 100px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
/* onboarding */
.ob{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding:40px 24px 28px}
.ob.hide{display:none}
.ob .hero-art{flex:1;display:grid;place-items:center}
.orb{width:220px;height:220px;border-radius:50%;background:conic-gradient(from 200deg,var(--lime),var(--sky),var(--violet),var(--pink),var(--lime));display:grid;place-items:center;animation:spin 12s linear infinite}
.orb span{width:170px;height:170px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:Unbounded;font-size:44px;font-weight:700;animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ob h2{font-size:28px;line-height:1.15;margin-bottom:10px}
.ob p{color:var(--muted);margin-bottom:22px}
.big{width:100%;padding:17px;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}
.big.lime{background:var(--lime);color:var(--ink)}
.big:disabled{opacity:.35}
.ints{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 auto}
.int{background:#fff;border:2px solid var(--soft);border-radius:18px;padding:16px 14px;text-align:left;font-weight:800;display:flex;gap:10px;align-items:center;transition:.15s}
.int span{font-size:24px}
.int.on{border-color:var(--ink);background:var(--ink);color:#fff;transform:scale(.97)}
.dots{display:flex;gap:6px;margin-bottom:20px}.dots i{width:22px;height:5px;border-radius:5px;background:var(--soft)}.dots i.on{background:var(--ink)}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top small{color:var(--muted);font-weight:700}
.top h2{font-size:21px}
.gp{background:var(--ink);color:var(--lime);font-weight:800;padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.ai{background:linear-gradient(135deg,var(--violet),#A27BFF);color:#fff;border-radius:24px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.ai:after{content:"✨";position:absolute;right:14px;top:10px;font-size:34px;opacity:.5}
.ai small{font-weight:800;font-size:11px;letter-spacing:.08em;opacity:.85}
.ai p{font-weight:800;font-size:16px;margin:4px 0 12px;max-width:85%}
.ai button{background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.filters button{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--soft);font-weight:800;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sec-t h3{font-size:16px}
.sec-t small{color:var(--muted);font-weight:700}
.item{width:100%;background:#fff;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:0 2px 0 var(--soft);transition:transform .12s}
.item:active{transform:scale(.98)}
.ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none}
.item b{display:block;font-size:15px}
.item span.meta{font-size:12px;color:var(--muted);font-weight:600}
.item .tag{margin-left:auto;font-weight:800;font-size:12px;padding:5px 9px;border-radius:10px;background:var(--lime);white-space:nowrap}
.item .tag.club{background:var(--soft)}
.item .tag.done{background:var(--ink);color:var(--lime)}
.bar{height:5px;background:var(--soft);border-radius:5px;margin-top:6px;overflow:hidden;width:120px}.bar i{display:block;height:100%;background:var(--violet)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(22,19,43,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:30px 30px 0 0;padding:14px 22px 30px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--soft);margin:0 auto 16px}
.sheet .ic{width:64px;height:64px;font-size:32px;border-radius:20px;margin-bottom:12px}
.sheet h2{font-size:22px;margin-bottom:6px}
.sheet p{color:var(--muted);margin-bottom:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.facts div{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:700}
.facts b{display:block;color:var(--ink);font-size:14px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.45;font-weight:600}
.msg.bot{background:#fff;border-bottom-left-radius:6px;box-shadow:0 2px 0 var(--soft)}
.msg.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.sugs button{background:#fff;border:1.5px dashed var(--violet);color:var(--violet);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;font-size:13px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}

/* profile */
.pf{text-align:center;margin-bottom:18px}
.av{width:92px;height:92px;border-radius:30px;margin:0 auto 10px;background:linear-gradient(135deg,var(--lime),var(--sky));display:grid;place-items:center;font-size:44px}
.pf h2{font-size:22px}
.lvl{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}
.lvl .row{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:8px}
.lvl .row span{color:var(--lime)}
.lvl .bar{width:100%;height:9px;background:#2d2850}.lvl .bar i{background:linear-gradient(90deg,var(--lime),var(--sky))}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.badges div{background:#fff;border-radius:16px;padding:12px 4px;text-align:center;font-size:26px;box-shadow:0 2px 0 var(--soft)}
.badges div.off{filter:grayscale(1);opacity:.35}
.badges small{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-top:4px}
.goal{background:linear-gradient(135deg,#E5FFB0,#C8F5FF);border-radius:22px;padding:16px;margin-bottom:14px}
.goal b{font-size:14px}.goal p{font-size:12px;color:var(--muted);font-weight:700;margin:4px 0 10px}
.goal .bar{width:100%;height:9px;background:rgba(255,255,255,.7)}.goal .bar i{background:var(--ink)}
.drops{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.drop{flex:none;width:140px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 0 var(--soft)}
.drop .e{font-size:30px}.drop b{display:block;font-size:13px;margin:6px 0 2px}.drop span{font-size:12px;font-weight:800;color:var(--violet)}
.drop .lim{font-size:10px;font-weight:800;color:var(--pink)}

/* tabbar */
.tabs{position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);border-radius:26px;display:flex;justify-content:space-around;padding:8px;z-index:20}
.tabs button{color:#8E88B5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;padding:6px 10px;border-radius:16px;min-width:62px}
.tabs button .e{font-size:20px;filter:grayscale(1)}
.tabs button.on{color:var(--ink);background:var(--lime)}
.tabs button.on .e{filter:none}

.toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast b{color:var(--lime)}
.c-lime{background:#EFFFC8}.c-violet{background:#E7E0FF}.c-pink{background:#FFE0EE}.c-sky{background:#DDF6FF}.c-sun{background:#FFF1C9}

.school{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin-top:8px}
.school p{font-size:13px;line-height:1.7;opacity:.85;margin:6px 0 12px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 a{background:var(--lime);color:var(--ink);text-decoration:none;text-align:center;padding:11px;border-radius:14px;font-weight:800;font-size:14px}
.row2 a+a{background:#2d2850;color:#fff}
.tcard{background:#fff;border-radius:24px;padding:18px;box-shadow:0 2px 0 var(--soft);margin-bottom:12px}
.tcard h3{font-size:17px;margin-bottom:10px}
.tcard label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.inp{background:var(--paper);border:2px solid var(--soft);border-radius:14px;padding:12px;font-weight:700}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 0;border-radius:12px;background:var(--paper);font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.step{display:flex;align-items:center;gap:14px}.step button{width:44px;height:44px;border-radius:14px;background:var(--paper);font-size:22px;font-weight:800}.step b{font-size:22px;font-family:Unbounded;min-width:24px;text-align:center}
.rule{font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin:10px 6px 14px}
.tt{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.kid{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--soft)}
.kid .ka{width:40px;height:40px;border-radius:13px;background:var(--paper);display:grid;place-items:center;font-size:22px;flex:none}
.kid b{display:block;font-size:14px}.kid small{font-size:11px;color:var(--muted);font-weight:700}
.kid .okb,.kid .tag{margin-left:auto;white-space:nowrap;font-weight:800;font-size:12px;padding:8px 10px;border-radius:11px}
.kid .okb{background:var(--lime)}.kid .tag.done{background:var(--ink);color:var(--lime)}
button.gp{cursor:pointer}
.mlang{display:none;position:absolute;top:14px;right:14px;z-index:35;background:var(--soft);border-radius:999px;padding:3px}
.mlang button{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;color:var(--muted)}
.mlang button.on{background:var(--ink);color:#fff}
/* Telegram Mini App: full-screen, no device frame */
html,body{height:100%;background:var(--paper);overflow:hidden}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
.app{position:fixed;inset:0;height:var(--tg-viewport-height,100dvh);background:var(--paper);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.view{padding-top:58px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.tabs{bottom:calc(12px + env(safe-area-inset-bottom))}
.ob{overflow-y:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.ob .hero-art{min-height:240px}
.mlang{display:flex}
.fld{width:100%;background:#fff;border:2px solid var(--soft);border-radius:14px;padding:13px 14px;font:inherit;font-weight:700;font-size:16px;color:var(--ink);outline:none}
.fld:focus{border-color:var(--violet)}
.flbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 6px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.fld{appearance:none;-webkit-appearance:none}
.note{background:#FFF1C9;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.5;margin:16px 0}
.err{color:var(--pink);font-weight:800;font-size:13px;min-height:18px;margin:10px 0 4px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.center .em{font-size:64px;margin-bottom:14px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--violet);margin:0 auto;animation:spin .8s linear infinite}
.adm .kid{align-items:flex-start}
.adm .acts{margin-left:auto;display:flex;gap:6px}
.adm .acts button{font-weight:800;font-size:12px;padding:8px 10px;border-radius:11px;background:var(--lime)}
.adm .acts button.no{background:var(--soft)}
</style>
</head>

function bindScreen(){
  const ints=$("ints");
  if(ints)ints.onclick=e=>{const b=e.target.closest(".int");if(!b)return;const i=+b.dataset.i;S.ints.has(i)?S.ints.delete(i):S.ints.add(i);b.classList.toggle("on");
    document.querySelector('[data-go="sdone"]').disabled=S.ints.size<2;try{tg.HapticFeedback.selectionChanged()}catch(e){}};
  $("scr").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,b));
}
async function go(to,btn){const t=L(),f=S.form;readForm();S.err="";
  if(to==="retry"){const was=S.scr;await boot();if(was==="pending"&&S.scr==="pending")fail(t.stillPend);return}
  if(to==="admin"){return openAdmin()}
  if(to==="ints"&&(f.name.length<2||!f.grade||!f.letter))return fail(t.badForm);
  if(to==="sdone"||to==="tdone"){
    if(to==="tdone"&&(f.name.length<2||f.subject.length<2))return fail(t.badForm);
    btn.disabled=true;
    const body=to==="sdone"?{role:"student",name:f.name,grade:f.grade,letter:f.letter,interests:[...S.ints]}:{role:"teacher",name:f.name,subject:f.subject};
    let r;try{r=await api("register",body)}catch(e){r={}}
    if(r.ok||r.error==="already_registered"){haptic("success");applyMe({user:r.user,admin:r.admin??S.admin});return}
    btn.disabled=false;return fail(t.errP);
  }
  S.scr=to;paint();
}

async function openAdmin(){S.adminOpen=true;paint();const r=await api("admin").catch(()=>({}));S.pending=r.pending||[];render()}
async function decide(id,approve){const t=L();const r=await api("admin",{id,approve}).catch(()=>({}));
  if(r.pending){S.pending=r.pending;haptic("success");toast(approve?t.okT:t.noT)}render()}
function renderAdmin(t,v){
  v.innerHTML=`<div class="top"><div><small>61 GOOD AI</small><h2>${t.admT}</h2></div><button class="gp" id="admX">${t.backB}</button></div>
  <div class="tcard adm">${S.pending.length?S.pending.map(p=>`<div class="kid"><span class="ka">🧑‍🏫</span><div><b>${esc(p.name)}</b><small>${esc(p.subject)}${p.username?" · @"+esc(p.username):""} · ID ${p.id}</small></div>
    <div class="acts"><button data-ap="${p.id}">${t.approve}</button><button class="no" data-rj="${p.id}">${t.reject}</button></div></div>`).join(""):`<p style="color:var(--muted);font-weight:700">${t.admEmpty}</p>`}</div>`;
  $("admX").onclick=goBack;
  v.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{b.disabled=true;decide(b.dataset.ap,true)});
  v.querySelectorAll("[data-rj]").forEach(b=>b.onclick=()=>{b.disabled=true;decide(b.dataset.rj,false)});
}

function itemRow(it){const t=L(),j=S.joined[it.id];
  let tag=it.type==="m"?`+${it.gp}`:t.join;let cls=it.type==="m"?"":"club";
  if(j==="done"){tag="✓ +"+it.gp;cls="done"}else if(j){tag="✓";cls="done"}
  const sp=it.spots[0]+(j&&j!=="done"?1:0);
  return `<button class="item" data-id="${it.id}"><div class="ic ${it.c}">${it.e}</div><div><b>${tx(it.t)}</b><span class="meta">${tx(it.w)} · ${sp}/${it.spots[1]}</span><div class="bar"><i style="width:${sp/it.spots[1]*100}%"></i></div></div><span class="tag ${cls}">${tag}</span></button>`}

function render(){const t=L(),v=$("view"),u=S.me;
  const showApp=S.adminOpen||(!S.scr&&u);
  v.style.display=showApp?"":"none";
  $("tabs").style.display=showApp&&!S.adminOpen&&u.role==="student"?"":"none";
  if(!showApp)return;
  if(S.adminOpen){renderAdmin(t,v);return}
  if(u.role==="teacher"){renderTeacher(t,v);return}
  $("tabs").innerHTML=["🏠","🎯","✨","😎"].map((e,i)=>`<button class="${S.tab===i?"on":""}" data-t="${i}"><span class="e">${e}</span>${t.tabs[i]}</button>`).join("");
  const first=u.name.split(" ")[0];
  const top=`<div class="top"><div><small>${fmt(t.gradeN,{g:u.grade})}</small><h2>${fmt(t.hiN,{n:first})}</h2></div><span class="gp">⚡ ${S.points} GOOD</span></div>`;
  if(S.tab===0){
    const pass=it=>S.filter<0||it.cat===S.filter;
    const pref=ITEMS.filter(it=>S.ints.has(it.cat));const pick=(pref[0]||ITEMS[4]);
    const ms=ITEMS.filter(it=>it.type==="m"&&pass(it)).sort((a,b)=>S.ints.has(b.cat)-S.ints.has(a.cat));
    const cs=ITEMS.filter(it=>it.type==="c"&&pass(it)).sort((a,b)=>S.ints.has(b.cat)-S.ints.has(a.cat));
    v.innerHTML=top+`<div class="ai"><small>${t.aiK}</small><p>${tx(pick.t)} — ${tx(pick.w)}</p><button data-id="${pick.id}">${t.aiBtn} →</button></div>
    <div class="filters"><button class="${S.filter<0?"on":""}" data-f="-1">🔥 ${t.all}</button>${CATS.map(i=>`<button class="${S.filter===i?"on":""}" data-f="${i}">${INT_E[i]} ${t.interests[i]}</button>`).join("")}</div>
    ${ms.length?`<div class="sec-t"><h3>${t.missions}</h3><small>${ms.length}</small></div>`+ms.map(itemRow).join(""):""}
    ${cs.length?`<div class="sec-t"><h3>${t.clubs}</h3><small>${cs.length}</small></div>`+cs.map(itemRow).join(""):""}
    <div class="school"><b>🏫 ${t.schT}</b><p>📍 ${t.schA}<br>🕗 ${t.schH}<br>🚌 ${t.schB}</p><div class="row2"><a href="tel:+998712974982">📞 ${t.call}</a><a target="_blank" rel="noopener" href="https://2gis.uz/tashkent/firm/70000001036679067">🗺️ ${t.map}</a></div></div>`;
  } else if(S.tab===1){
    const mine=ITEMS.filter(it=>S.joined[it.id]),open=ITEMS.filter(it=>it.type==="m"&&!S.joined[it.id]);
    v.innerHTML=top+`<div class="sec-t"><h3>${t.myM}</h3></div>`+(mine.length?mine.map(itemRow).join(""):`<p style="color:var(--muted);font-weight:700;margin-bottom:16px">${t.empty}</p>`)+
      (open.length?`<div class="sec-t"><h3>${t.openM}</h3></div>`+open.map(itemRow).join(""):"");
  } else if(S.tab===2){
    v.innerHTML=`<div class="top"><div><small>61 GOOD</small><h2>AI ✨</h2></div><span class="gp">⚡ ${S.points}</span></div><div class="chat">`+
      S.chat.map(m=>m.typing?`<div class="msg bot"><span class="typing"><i></i><i></i><i></i></span></div>`:`<div class="msg ${m.bot?"bot":"me"}">${m.k==="hello"?t.aiHello:m.bot?t.a[m.k]:t.q[m.k]}</div>`).join("")+
      `<div class="sugs">${t.q.map((q,i)=>`<button data-q="${i}">${q}</button>`).join("")}</div></div>`;
    v.scrollTop=v.scrollHeight;
  } else {
    const lvl=Math.floor(S.points/100),pr=S.points%100;const nd=Object.values(S.joined).filter(x=>x==="done").length;
    const drops=[["🧢",{uz:"Maktab kepkasi",ru:"Кепка школы",en:"School cap"},150,7],["🎟️",{uz:"Master-klass",ru:"Мастер-класс",en:"Workshop"},200,3],["📕",{uz:"Kitob sovg‘asi",ru:"Книга в подарок",en:"Gift book"},120,10],["🏅",{uz:"Oltin nishon",ru:"Золотой бейдж",en:"Gold badge"},300,1]];
    const photo=TGU.photo_url&&/^https:\/\//.test(TGU.photo_url)?`<img src="${esc(TGU.photo_url)}" alt="" style="width:100%;height:100%;border-radius:30px;object-fit:cover">`:"🦊";
    v.innerHTML=`<div class="pf"><div class="av">${photo}</div><h2>${esc(u.name)}</h2><small style="color:var(--muted);font-weight:700">${fmt(t.gradeN,{g:u.grade})} · ${S.ints.size?[...S.ints].map(i=>INT_E[i]).join(" "):"🎨 📸"}</small></div>
    <div class="lvl"><div class="row">${t.lvl} ${lvl} <span>${pr}/100</span></div><div class="bar"><i style="width:${pr}%"></i></div><small style="opacity:.6;font-weight:700;font-size:11px">${100-pr} GOOD ${t.next}</small></div>
    <div class="badges">${["🔥","🎨","👯","👑"].map((e,i)=>`<div class="${i>1+nd?"off":""}">${e}<small>${t.badges[i]}</small></div>`).join("")}</div>
    <div class="goal"><b>${t.goalT}</b><p>${t.goalP}</p><div class="bar"><i style="width:${Math.min(100,(1380+S.points)/20)}%"></i></div></div>
    <div class="sec-t"><h3>${t.drops}</h3></div><div class="drops">${drops.map(d=>`<div class="drop"><div class="e">${d[0]}</div><b>${tx(d[1])}</b><span>⚡ ${d[2]}</span><div class="lim">${d[3]} ${t.left}</div></div>`).join("")}</div>`;
  }
}
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;S.tab=+b.dataset.t;try{tg.HapticFeedback.selectionChanged()}catch(e){}render();$("view").scrollTop=S.tab===2?$("view").scrollHeight:0};
$("view").onclick=e=>{if(!S.me||S.me.role!=="student"||S.adminOpen)return;
  const f=e.target.closest("[data-f]");if(f){S.filter=+f.dataset.f;render();return}
  const q=e.target.closest("[data-q]");if(q){ask(+q.dataset.q);return}
  const it=e.target.closest("[data-id]");if(it)openSheet(it.dataset.id);
};
function ask(i){S.chat.push({k:i},{typing:1});render();setTimeout(()=>{S.chat.pop();S.chat.push({bot:1,k:i});render()},900)}

function openSheet(id){const it=ITEMS.find(x=>x.id===id),t=L(),j=S.joined[id];
  $("sheet").innerHTML=`<div class="grab"></div><div class="ic ${it.c}">${it.e}</div><h2>${tx(it.t)}</h2><p>${tx(it.d)}</p>
  <div class="facts"><div>${t.when}<b>${tx(it.w)}</b></div><div>${t.where}<b>${tx(it.p)}</b></div><div>${t.spots}<b>${it.spots[0]+(j&&j!=="done"?1:0)} / ${it.spots[1]}</b></div><div>${it.type==="m"?t.reward:t.age}<b>${it.type==="m"?"⚡ +"+it.gp+" GOOD":it.age}</b></div></div>
  ${!j?`<button class="big lime" id="joinB">${t.join}</button>`:j==="done"?`<button class="big" disabled>✓ +${it.gp} GOOD</button>`:
    `<button class="big" disabled>${it.type==="m"?t.pending:t.joined}</button>`}`;
  $("scrim").classList.add("on");$("sheet").classList.add("on");syncBack();
  const jb=$("joinB");if(jb)jb.onclick=()=>{S.joined[id]=true;haptic("success");render();openSheet(id)};
}

function renderTeacher(t,v){const m=S.tm,ages=["10+","11+","12+","14+"],gps=[10,20,30,40];
  let h=`<div class="top"><div><small>${t.tSub}</small><h2>${fmt(t.tHiN,{n:S.me.name.split(" ")[0]})}</h2></div>${S.admin?`<button class="gp" id="toA">${t.admBtn}</button>`:""}</div>`;
  if(m.stage===0){
    h+=`<div class="tcard"><h3>${t.tNew}</h3>
      <label>${t.tTitle}</label><div class="inp">🎨 ${t.tTitleDef}</div>
      <label>${t.tAge}</label><div class="seg">${ages.map((a,i)=>`<button data-age="${i}" class="${m.age===i?"on":""}">${a}</button>`).join("")}</div>
      <label>${t.tPeople}</label><div class="step"><button data-n="-1">−</button><b>${m.n}</b><button data-n="1">+</button></div>
      <label>${t.tReward}</label><div class="seg">${gps.map((g,i)=>`<button data-gp="${i}" class="${m.gp===i?"on":""}">+${g}</button>`).join("")}</div>
      <button class="big lime" id="pub" style="margin-top:18px">${t.tPublish}</button></div><p class="rule">🛡️ ${t.tRule}</p>`;
  } else if(m.stage===1){
    h+=`<div class="tcard"><h3>${t.tAiPick}</h3><div class="msg bot" style="max-width:none"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
  } else {
    const gp=gps[m.gp],kids=KIDS.slice(0,m.n);
    h+=`<div class="tcard"><small class="tt">🎨 ${t.tTitleDef} · ${ages[m.age]} · +${gp} GOOD</small><h3>✨ ${t.tAiPick}</h3>`+
      kids.map((k,i)=>{const ok=m.ok.has(i);return `<div class="kid"><span class="ka">${k[0]}</span><div><b>${k[1]}</b><small>${t.tWhy[i%5]} · ${t.tJoin}</small></div>${ok?`<span class="tag done">${t.tConfirmed}</span>`:`<button class="okb" data-ok="${i}">${t.tConfirm}</button>`}</div>`}).join("")+`</div>`;
    h+=m.ok.size===kids.length?`<p class="rule" style="color:var(--ink)">${t.tDone}</p><button class="big" id="again">${t.tAgain}</button>`:`<p class="rule">🛡️ ${t.tRule}</p>`;
  }
  v.innerHTML=h;
  const ta=$("toA");if(ta)ta.onclick=openAdmin;
  v.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{m.age=+b.dataset.age;render()});
  v.querySelectorAll("[data-gp]").forEach(b=>b.onclick=()=>{m.gp=+b.dataset.gp;render()});
  v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{m.n=Math.max(1,Math.min(6,m.n+ +b.dataset.n));render()});
  const pb=$("pub");if(pb)pb.onclick=()=>{m.stage=1;render();setTimeout(()=>{m.stage=2;render()},1200)};
  v.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ok;m.ok.add(i);haptic("success");render();toast(`⚡ <b>+${gps[m.gp]} GOOD</b> ${KIDS[i][1]}`)});
  const ag=$("again");if(ag)ag.onclick=()=>{m.stage=0;m.ok=new Set();render()};
}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");syncBack()}
$("scrim").onclick=closeSheet;
function toast(h){const x=$("toast");x.innerHTML=h;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2200)}
setLang(S.lang);
boot();
</script>
</body>
</html>
